# Railway deployment configuration for the Vite + React frontend.
# Set Root Directory to "frontend" in the Railway service dashboard.
#
# Build args:
#   VITE_API_BASE_URL — absolute URL of the backend service (e.g.
#                       https://api.personalize.lakeb2b.com). Set as a
#                       Railway service variable AND a build arg.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "serve -s dist -l $PORT"
healthcheckPath = "/"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
