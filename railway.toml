# Root-level Railway config.
# Lets Railway deploy this repo with ZERO additional configuration:
# point a Railway service at the repo, no Root Directory needed,
# Railway sees this railway.toml + the root Dockerfile and builds the API.
#
# The Worker service: clone this service in Railway, override the start
# command to `arq app.workers.arq_worker.WorkerSettings`.
#
# The Frontend service: separate Railway service, Root Directory = "frontend".
# See docs/railway.md for the full multi-service recipe.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
