# Railway deployment configuration for the FastAPI backend.
# Set Root Directory to "backend" in the Railway service dashboard.
#
# This file describes the API service. The arq webhook+batch worker is a
# SECOND Railway service that uses the SAME directory and Dockerfile but
# overrides the start command — see docs/railway.md for the recipe.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
